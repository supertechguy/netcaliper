# SPDX-License-Identifier: GPL-3.0-only
name: cloud-ci
on:
  push:
    branches: [main]
    paths: ["cloud/**", "schemas/**", ".github/workflows/cloud-ci.yml"]
  pull_request:
    paths: ["cloud/**", "schemas/**", ".github/workflows/cloud-ci.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: cloud

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: node scripts/gen-types.mjs --check
      - run: npx vitest run

  # Runs only once the repository is set up for it (docs/DEPLOY.md): repository variable
  # CLOUDFLARE_DEPLOY=true, secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID, variables
  # ACCESS_TEAM_DOMAIN + ACCESS_AUD (variables or secrets).
  deploy:
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-cloud
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN || secrets.ACCESS_TEAM_DOMAIN }}
      ACCESS_AUD: ${{ vars.ACCESS_AUD || secrets.ACCESS_AUD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci
      - name: D1 database (create on first deploy)
        id: d1
        run: |
          id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));const d=l.find(x=>x.name==="netcaliper");if(d)console.log(d.uuid)')
          if [ -z "$id" ]; then
            npx wrangler d1 create netcaliper >/dev/null
            id=$(npx wrangler d1 list --json | node -e 'const l=JSON.parse(require("fs").readFileSync(0));console.log(l.find(x=>x.name==="netcaliper").uuid)')
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - run: node scripts/deploy-config.mjs "${{ steps.d1.outputs.id }}" "$ACCESS_TEAM_DOMAIN" "$ACCESS_AUD"
      - run: npx wrangler d1 migrations apply netcaliper --remote --config wrangler.deploy.json
      - run: npx wrangler deploy --config wrangler.deploy.json
      - name: Smoke test
        run: |
          sleep 5
          curl -fsS https://netcaliper.supertechguy.net/api/v1/health
          # no Access identity → refused by the Worker itself
          test "$(curl -s -o /dev/null -w '%{http_code}' https://netcaliper.supertechguy.net/api/v1/admin/me)" != 200
