[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "netcaliper"
version = "0.0.1"
description = "Open handheld network tester (EtherScope/CyberScope-class) for Raspberry Pi"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "jinja2>=3.1",
  "pydantic>=2.6",
  "aiosqlite>=0.20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
netcaliper = "netcaliper.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["netcaliper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "hw: needs real hardware; auto-skips when the capability is not detected",
  "netns: needs root to build veth/netns test networks",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "RUF"]
ignore = ["S101", "S603", "S607", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["netcaliper/core", "netcaliper/drivers"]
