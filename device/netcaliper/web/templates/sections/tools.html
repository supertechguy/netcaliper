{% extends "base.html" %}
{% block title %}Tools · netcaliper{% endblock %}
{% block main %}
<section class="page">
  <h1>Tools <span class="dim">/ hardware</span></h1>
  <p>
    <button class="btn" hx-post="/api/v1/hardware/refresh" hx-swap="none"
            hx-on::after-request="htmx.trigger('#hw', 'refresh')" autofocus>Re-detect</button>
    <span class="dim">source: {{ inv.source }}{% if mock %} (mock){% endif %}</span>
  </p>
  <div id="hw" hx-get="/partials/hardware" hx-trigger="load, refresh">loading…</div>
</section>
{% endblock %}
