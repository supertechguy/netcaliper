# Recorded on the real uConsole CM4 (ClockworkPi v3.1 image, Trixie) 2026-11-22, no USB test hardware; anonymized.
source: fixture:uconsole-cm4
platform:
  model: Raspberry Pi Compute Module 4 Rev 1.1
  compatible:
  - raspberrypi,4-compute-module
  - brcm,bcm2711
  dmi_product: ''
  arch: aarch64
  kernel: 6.12.62-v8+
  os_release:
    ID: debian
    VERSION_ID: '13'
    VERSION_CODENAME: trixie
    PRETTY_NAME: Debian GNU/Linux 13 (trixie)
  python: 3.13.5
  drm:
  - name: DSI-1
    status: connected
    modes:
    - 720x1280
  - name: HDMI-A-1
    status: disconnected
    modes: []
  - name: HDMI-A-2
    status: disconnected
    modes: []
usb:
- path: 1-1
  vid: 05e3
  pid: 0608
  manufacturer: ''
  product: USB2.0 Hub
  serial: ''
  speed_mbps: 480
  interface_drivers:
  - hub
- path: 1-1.1
  vid: 1eaf
  pid: '0024'
  manufacturer: ClockworkPI
  product: uConsole
  serial: ECAAC36E
  speed_mbps: 12
  interface_drivers:
  - cdc_acm
  - usbhid
net:
- name: eth0
  mac: 2c:cf:67:64:8b:15
  driver: bcmgenet
  bus: platform
  usb_path: null
  wireless: false
  phy: null
  has_phydev: true
  operstate: down
  default_route: false
  link_modes:
  - 10baseT/Half
  - 10baseT/Full
  - 100baseT/Half
  - 100baseT/Full
  - 1000baseT/Half
  - 1000baseT/Full
- name: lo
  mac: 00:00:00:5c:db:b2
  driver: null
  bus: virtual
  usb_path: null
  wireless: false
  phy: null
  has_phydev: false
  operstate: unknown
  default_route: false
  link_modes: []
- name: wlan0
  mac: 2c:cf:67:d8:da:72
  driver: brcmfmac
  bus: sdio
  usb_path: null
  wireless: true
  phy: phy0
  has_phydev: false
  operstate: up
  default_route: true
  link_modes: []
wiphys:
- name: phy0
  iw_info_file: iw/iw_phy_brcmfmac.txt
bluetooth:
- name: hci0
  driver: hci_uart_bcm
  bus: platform
  usb_path: null
power_supplies:
- name: axp20x-battery
  type: Battery
  capacity: 100
  status: Charging
- name: axp22x-ac
  type: Mains
  capacity: null
  status: null
kernel_modules:
- axp20x_battery
- brcmfmac
- hci_uart
tools:
  iw: /usr/sbin/iw
  ip: /usr/bin/ip
  ethtool: /usr/sbin/ethtool
  wpa_supplicant: /usr/sbin/wpa_supplicant
  nmap: /usr/bin/nmap
  arp-scan: /usr/sbin/arp-scan
  tcpdump: /usr/bin/tcpdump
  tshark: /usr/bin/tshark
  iperf3: /usr/bin/iperf3
  nft: /usr/sbin/nft
  rtl_433: /usr/bin/rtl_433
  rtl_power: /usr/bin/rtl_power
  rtl_test: /usr/bin/rtl_test
  bluetoothctl: /usr/bin/bluetoothctl
  cage: /usr/bin/cage
  chromium: /usr/bin/chromium
  chromium-browser: null
